services:
  whatsapp-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rebook-whatsapp-worker
    restart: unless-stopped
    init: true
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      WHATSAPP_BRIDGE_SECRET: "${WHATSAPP_BRIDGE_SECRET}"
      WHATSAPP_DATA_DIR: "/data/rebook-whatsapp"
      WHATSAPP_MAX_SESSIONS: "${WHATSAPP_MAX_SESSIONS:-2}"
      WHATSAPP_DEFAULT_COUNTRY_CODE: "${WHATSAPP_DEFAULT_COUNTRY_CODE:-91}"
      WHATSAPP_MAX_RECIPIENTS: "${WHATSAPP_MAX_RECIPIENTS:-100}"
    volumes:
      - rebook_whatsapp_data:/data/rebook-whatsapp
    security_opt:
      - no-new-privileges:true

volumes:
  rebook_whatsapp_data:
